name: Auto Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Google Clasp
        run: npm install -g @google/clasp

      - name: Setup Clasp Auth & Configuration
        run: |
          echo "${{ secrets.CLASPRC_JSON }}" > ~/.clasprc.json
          echo "{\"scriptId\":\"${{ secrets.SCRIPT_ID }}\",\"rootDir\":\".\"}" > .clasp.json

      - name: Push Code to Apps Script
        run: clasp push --force

      - name: Deploy Apps Script Web App
        run: clasp deploy -i AKfycbxh-fZpL4u5Wu0lY6-v1gwkp6BbhIxyYAYRxf23raJq-82gpf8PCiRbCifrqnpjGY1K --description "Auto-deploy commit ${{ github.sha }}" || clasp deploy --description "Auto-deploy commit ${{ github.sha }}" || true
