name: Auto Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Google Clasp
        run: npm install -g @google/clasp

      - name: Setup Clasp Auth & Configuration
        env:
          CLASPRC_RAW: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const os = require("os");
            const path = require("path");
            let raw = (process.env.CLASPRC_RAW || "").trim();
            if (!raw) {
              console.error("Error: CLASPRC_JSON secret is empty");
              process.exit(1);
            }
            if ((raw.startsWith("\"") && raw.endsWith("\"")) || (raw.startsWith("\x27") && raw.endsWith("\x27"))) {
              raw = raw.slice(1, -1);
            }
            let data;
            try {
              data = JSON.parse(raw);
            } catch (e) {
              try {
                data = JSON.parse(raw.replace(/\\n/g, "\n").replace(/\\"/g, "\""));
              } catch (e2) {
                console.error("Failed to parse CLASPRC_JSON:", e.message);
                process.exit(1);
              }
            }
            fs.writeFileSync(path.join(os.homedir(), ".clasprc.json"), JSON.stringify(data, null, 2), "utf8");
            console.log("Successfully prepared ~/.clasprc.json (keys:", Object.keys(data), ")");

            const scriptId = (process.env.SCRIPT_ID || "").trim() || "1KZ6YuM9Hty09nSqOfUAA9jW-dg2Sa3ZMc0Rhqb_M0KXm6xppy4efR_en";
            fs.writeFileSync(".clasp.json", JSON.stringify({ scriptId, rootDir: "." }, null, 2), "utf8");
            console.log("Using scriptId:", scriptId);
          '

      - name: Push Code to Apps Script
        run: clasp push --force

      - name: Deploy Apps Script Web App
        run: clasp deploy -i AKfycbxh-fZpL4u5Wu0lY6-v1gwkp6BbhIxyYAYRxf23raJq-82gpf8PCiRbCifrqnpjGY1K --description "Auto-deploy commit ${{ github.sha }}" || clasp deploy --description "Auto-deploy commit ${{ github.sha }}" || true
